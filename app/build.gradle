import java.util.Properties

plugins {
    id 'com.android.application'
}

def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file('keystore.properties')
def hasReleaseSigning = releasePropertiesFile.exists()
if (hasReleaseSigning) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}

android {
    namespace 'io.github.jeffin_v.apiflow'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.jeffin_v.apiflow'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '1.0.4'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseProperties['storeFile'])
                storePassword releaseProperties['storePassword']
                keyAlias releaseProperties['keyAlias']
                keyPassword releaseProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
